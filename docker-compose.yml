services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: cafe_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d # Maps the whole folder
      - pgdata:/var/lib/postgresql/data        # Persists data locally

volumes:
  pgdata: # This keeps your data alive even if the container is destroyed